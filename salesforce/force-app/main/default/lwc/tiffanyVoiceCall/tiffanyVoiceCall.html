<template>
    <section class="card" aria-labelledby="voice-title">
        <header class="card-header">
            <span class="badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" focusable="false">
                    <path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.93V21h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.07A7 7 0 0 1 5 12a1 1 0 1 1 2 0 5 5 0 0 0 10 0Z"></path>
                </svg>
            </span>
            <div>
                <h2 id="voice-title" class="title">{heading}</h2>
                <p class="subtitle">{subheading}</p>
            </div>
        </header>

        <div class="card-body">
            <template lwc:if={started}>
                <p class="success" role="status">{successText}</p>
                <button class="link-btn" type="button" onclick={handleReset}>Request a call to another number</button>
            </template>
            <template lwc:else>
                <label class="field-label" for="voice-phone">Mobile number</label>
                <div class="phone-row">
                    <span class="prefix" aria-hidden="true">+91</span>
                    <input
                        id="voice-phone"
                        class="phone-input"
                        type="tel"
                        inputmode="numeric"
                        autocomplete="tel-national"
                        maxlength="14"
                        placeholder="10-digit mobile number"
                        value={phone}
                        disabled={busy}
                        oninput={handlePhone}
                    />
                </div>

                <label class="consent">
                    <input type="checkbox" checked={consent} disabled={busy} onchange={handleConsent} />
                    <span>I agree to receive a call now from the Tiffany Designs AI service assistant on this number.</span>
                </label>

                <button class="call-btn" type="button" disabled={callDisabled} onclick={handleCall}>
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1Z"></path>
                    </svg>
                    <span>{buttonText}</span>
                </button>

                <template lwc:if={errorText}>
                    <p class="error" role="alert">{errorText}</p>
                </template>
            </template>
        </div>
    </section>
</template>
